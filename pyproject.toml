[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faithfulcut"
version = "0.1.0"
description = "Information-faithful replay and audited risk control for commit-aware CI test selection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["faithfulcut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
